<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-icon"><i class="fa-solid fa-file-signature"></i></div>
            <h1>AI Resume Analyzer</h1>
            <p>Optimize your resume for ATS and land your next role.</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label>Upload Resume (PDF)</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="resume" accept=".pdf" class="file-input">
                    <div class="file-upload-design" id="drop-zone">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span id="file-name">Click to browse or drag PDF here</span>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Target Job Description</label>
                <textarea id="job" placeholder="Paste the job description here to see how well your resume matches..."></textarea>
            </div>

            <button id="analyze-btn" onclick="analyze()">
                <span id="btn-text">Analyze Resume</span>
                <i class="fa-solid fa-wand-magic-sparkles" id="btn-icon"></i>
                <div class="loader" id="btn-loader"></div>
            </button>
        </div>
    </div>

    <div id="result-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-chart-pie"></i> Analysis Report</h2>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="score-container" id="score-container" style="display: none;">
                <div class="circular-progress">
                    <svg viewBox="0 0 100 100">
                        <circle class="bg-circle" cx="50" cy="50" r="40"></circle>
                        <circle class="progress-circle" id="score-circle" cx="50" cy="50" r="40"></circle>
                    </svg>
                    <div class="score-value" id="score-value">0%</div>
                </div>
                <div class="score-label">ATS Match Score</div>
            </div>

            <div id="modal-body" class="modal-body markdown-format">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
